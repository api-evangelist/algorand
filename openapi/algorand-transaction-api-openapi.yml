openapi: 3.2.0
info:
  description: API for KMD (Key Management Daemon)
  title: KMD HTTP Transaction API
  contact:
    email: contact@algorand.com
  version: 0.0.1
servers:
- url: http://localhost/
security:
- api_key: []
tags:
- name: Transaction
paths:
  /v1/transaction/sign:
    post:
      description: Signs the passed transaction with a key from the wallet, determined by the sender encoded in the transaction.
      summary: Sign a transaction
      operationId: SignTransaction
      responses:
        '200':
          $ref: '#/components/responses/SignTransactionResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignTransactionRequest'
        required: true
      tags:
      - Transaction
components:
  schemas:
    PublicKey:
      description: PublicKey is an exported ed25519PublicKey
      $ref: '#/components/schemas/ed25519PublicKey'
    ed25519PublicKey:
      type: array
      items:
        type: integer
        format: uint8
      x-go-package: github.com/algorand/go-algorand/crypto
    APIV1POSTTransactionSignResponse:
      description: 'APIV1POSTTransactionSignResponse is the response to `POST /v1/transaction/sign`

        friendly:SignTransactionResponse'
      type: object
      properties:
        error:
          type: boolean
          x-go-name: Error
        message:
          type: string
          x-go-name: Message
        signed_transaction:
          type: string
          format: byte
          x-go-name: SignedTransaction
      x-go-package: github.com/algorand/go-algorand/daemon/kmd/lib/kmdapi
    SignTransactionRequest:
      description: APIV1POSTTransactionSignRequest is the request for `POST /v1/transaction/sign`
      type: object
      properties:
        public_key:
          $ref: '#/components/schemas/PublicKey'
        transaction:
          description: 'Base64 encoding of msgpack encoding of a `Transaction` object

            Note: SDK and goal usually generate `SignedTxn` objects

            in that case, the field `txn` / `Transaction` of the

            generated `SignedTxn` object needs to be used'
          type: string
          format: byte
          x-go-name: Transaction
        wallet_handle_token:
          type: string
          x-go-name: WalletHandleToken
        wallet_password:
          type: string
          x-go-name: WalletPassword
      x-go-name: APIV1POSTTransactionSignRequest
      x-go-package: github.com/algorand/go-algorand/daemon/kmd/lib/kmdapi
  responses:
    SignTransactionResponse:
      description: Response to `POST /v1/transaction/sign`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIV1POSTTransactionSignResponse'
  securitySchemes:
    api_key:
      description: 'Generated header parameter. This value can be found in `/kmd/data/dir/kmd.token`. Example value: ''330b2e4fc9b20f4f89812cf87f1dabeb716d23e3f11aec97a61ff5f750563b78'''
      type: apiKey
      name: X-KMD-API-Token
      in: header
      x-example: 330b2e4fc9b20f4f89812cf87f1dabeb716d23e3f11aec97a61ff5f750563b78
