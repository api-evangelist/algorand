openapi: 3.2.0
info:
  description: API for KMD (Key Management Daemon)
  title: KMD HTTP Versions API
  contact:
    email: contact@algorand.com
  version: 0.0.1
servers:
- url: http://localhost/
security:
- api_key: []
tags:
- name: Versions
paths:
  /versions:
    get:
      summary: Retrieves the current version
      operationId: GetVersion
      responses:
        '200':
          $ref: '#/components/responses/VersionsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionsRequest'
      tags:
      - Versions
components:
  responses:
    VersionsResponse:
      description: Response to `GET /versions`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionsResponse'
  schemas:
    VersionsResponse:
      description: 'VersionsResponse is the response to `GET /versions`

        friendly:VersionsResponse'
      type: object
      properties:
        versions:
          type: array
          items:
            type: string
          x-go-name: Versions
      x-go-package: github.com/algorand/go-algorand/daemon/kmd/lib/kmdapi
    VersionsRequest:
      description: VersionsRequest is the request for `GET /versions`
      type: object
      x-go-package: github.com/algorand/go-algorand/daemon/kmd/lib/kmdapi
  securitySchemes:
    api_key:
      description: 'Generated header parameter. This value can be found in `/kmd/data/dir/kmd.token`. Example value: ''330b2e4fc9b20f4f89812cf87f1dabeb716d23e3f11aec97a61ff5f750563b78'''
      type: apiKey
      name: X-KMD-API-Token
      in: header
      x-example: 330b2e4fc9b20f4f89812cf87f1dabeb716d23e3f11aec97a61ff5f750563b78
