- type: Features
  data:
  - name: Real-Time Node Interaction
    description: Algod API provides live access to node state, pending transactions,
      and block production
  - name: Historical Ledger Analytics
    description: Indexer API enables deep search across all historical transactions,
      accounts, assets, and blocks
  - name: Transaction Submission
    description: Submit signed raw transactions or transaction groups directly via
      the Algod API
  - name: Smart Contract Support
    description: Query AVM application state, box storage, and logs; compile and simulate
      TEAL programs
  - name: Asset Management
    description: Query Algorand Standard Assets (ASA) metadata, balances, and transaction
      history
  - name: State Proofs
    description: Retrieve cryptographic state proofs for cross-chain verification
      and light-client support
  - name: Free Public Nodes
    description: Nodely/AlgoNode provides free archival Algod and Indexer endpoints
      on mainnet and testnet
  - name: AlgoKit Toolchain
    description: End-to-end developer toolkit with CLI, LocalNet sandbox, and utility
      SDKs
- type: UseCases
  data:
  - name: DeFi Application Development
    description: Query on-chain liquidity pools, AMMs, and ASA token balances in real
      time
  - name: NFT Marketplaces
    description: Look up ASA metadata, ownership history, and transfer transactions
      for NFTs
  - name: Block Explorers
    description: Retrieve and display blocks, transactions, and account state via
      Indexer search APIs
  - name: Wallet Integration
    description: Fetch account balances, transaction history, and pending transactions
      for wallet UIs
  - name: Transaction Automation
    description: Construct, sign, and broadcast payment, asset transfer, or application
      call transactions
  - name: Compliance and Auditing
    description: Search historical transactions by address, round, or note field for
      audit trails
  - name: Smart Contract Deployment
    description: Compile TEAL programs, simulate execution, and deploy AVM applications
- type: Integrations
  data:
  - name: AlgoKit
    description: Official Algorand developer toolkit with CLI and SDK utilities for
      Python and TypeScript
  - name: Nodely
    description: Free and commercial archival Algod and Indexer endpoints with global
      infrastructure
  - name: AlgoNode
    description: Legacy free public API endpoints for Algorand mainnet and testnet
  - name: Pera Wallet
    description: Reference wallet implementation using Algorand SDKs for transaction
      signing
  - name: Vestige
    description: DeFi analytics platform querying Algorand pools and assets via Indexer
